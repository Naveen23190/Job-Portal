services:
  - type: web
    name: jobhire-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/jobs
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://jobhire-web.onrender.com

  - type: web
    name: jobhire-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://jobhire-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
