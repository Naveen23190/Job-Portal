
spring.application.name=job-portal

# Server
server.port=${PORT:8080}

# PostgreSQL Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobportal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=jobportal

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=jobportal
spring.flyway.default-schema=jobportal
spring.flyway.locations=classpath:db/migration
